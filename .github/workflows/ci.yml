name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: allurx/allurx-build/.github/workflows/maven-ci.yml@main

  selenium:
    name: Selenium browser verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up build tools
        uses: allurx/allurx-build/.github/actions/setup@466a9d3e2d773d2394f6311a22aaa2fc4a295b05 # Reviewed main revision
        with:
          maven: 'true'
      - name: Verify real Chrome startup and interaction
        shell: bash
        run: |
          chrome="$(command -v google-chrome)"
          driver="$(command -v chromedriver)"
          test -x "$chrome"
          test -x "$driver"
          "$chrome" --version
          "$driver" --version

          dbus-run-session -- mvn -B -ntp -pl kit-selenium -am \
            -Dtest=ChromeStartupTest -Dsurefire.failIfNoSpecifiedTests=false \
            "-Dkit.selenium.chromePath=$chrome" "-Dwebdriver.chrome.driver=$driver" verify

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("kit-selenium/target/surefire-reports/TEST-io.allurx.kit.selenium.test.ChromeStartupTest.xml")
          suite = ET.parse(report).getroot()
          expected = {"tests": "1", "failures": "0", "errors": "0", "skipped": "0"}
          actual = {name: suite.get(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"Real Chrome verification did not pass without skips: {actual}")
          print("Real Chrome startup and interaction passed: 1 test, 0 skipped.")
          PY
      - name: Preserve Selenium reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selenium-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: kit-selenium/target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 14

  dependabot-merge:
    name: Merge routine Dependabot updates
    needs: [verify, selenium]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Check automatic merge policy
        id: policy
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";

          const updates = JSON.parse(process.env.DEPENDENCIES);
          const actionVersion = /^v?(0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/;
          const mavenVersion = /^(0|[1-9]\d*)(?:\.(?:0|[1-9]\d*))+(?:-(jre|android))?$/;
          const eligible = updates.length > 0 && updates.every((update) => {
              const { dependencyName, packageEcosystem, updateType, prevVersion, newVersion } = update;
              if (!["maven", "github_actions"].includes(packageEcosystem)) return false;
              if (dependencyName === "io.allurx:maven-parent" ||
                  dependencyName === "allurx/allurx-build" ||
                  dependencyName.startsWith("allurx/allurx-build/")) return false;

              const pattern = packageEcosystem === "maven" ? mavenVersion : actionVersion;
              const previous = pattern.exec(prevVersion);
              const next = pattern.exec(newVersion);
              if (!previous || !next || previous[1] !== next[1]) return false;
              if (previous[2] || next[2]) {
                  if (dependencyName !== "com.google.guava:guava" || previous[2] !== next[2]) return false;
              }

              return updateType === "version-update:semver-patch" ||
                  (updateType === "version-update:semver-minor" && previous[1] !== "0");
          });

          appendFileSync(process.env.GITHUB_OUTPUT, `eligible=${eligible}\n`);
          if (!eligible) console.log("This update requires manual review.");
          NODE
      - name: Merge the verified pull request
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          current_base="$(gh pr view "$PR_URL" --json baseRefName --jq .baseRefName)"
          if [ "$current_base" != "dev" ]; then
              echo "The pull request no longer targets dev; skipping automatic merge."
              exit 0
          fi

          gh pr merge --squash --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
