name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify toolchain
        run: |
          # 使用 runner 预装的 Maven，并输出实际 Maven 和 JDK 版本。
          mvn -version
      - name: Build, test and generate documentation
        run: |
          # 复用发布配置生成源码和文档；CI 跳过签名，执行到 verify。
          # 使用提交时间固定归档时间戳，使同一提交的构建结果更稳定。
          mvn -B -ntp -Prelease -Dgpg.skip=true \
            "-Dproject.build.outputTimestamp=$(git show -s --format=%ct HEAD)" \
            clean verify
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ github.run_attempt }}
          path: '**/target/surefire-reports/**'
          retention-days: 14
