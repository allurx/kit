name: CI
on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev, main]
    workflow_dispatch:
permissions:
    contents: read
    actions: read
concurrency:
    group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
    cancel-in-progress: true
jobs:
    verify:
        uses: allurx/allurx-build/.github/workflows/maven-ci.yml@f3cd85d5d435fb3093ad3c027f6788923aa802e7 # workflows-v2.0.0

    selenium:
        name: Selenium browser verification
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - name: Checkout project
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Java
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: temurin
                  java-version: "25"
                  cache: maven
            - name: Set up Maven
              uses: allurx/allurx-build/actions/setup-maven@f3cd85d5d435fb3093ad3c027f6788923aa802e7 # workflows-v2.0.0
            - name: Verify real Chrome startup and interaction
              shell: bash
              run: |
                  chrome="$(command -v google-chrome)"
                  driver="$(command -v chromedriver)"
                  test -x "$chrome"
                  test -x "$driver"
                  "$chrome" --version
                  "$driver" --version

                  mvn -B -ntp -pl kit-selenium -am \
                    -Dtest=ChromeStartupTest -Dsurefire.failIfNoSpecifiedTests=false \
                    "-Dkit.selenium.chromePath=$chrome" "-Dwebdriver.chrome.driver=$driver" verify

                  python3 - <<'PY'
                  from pathlib import Path
                  import xml.etree.ElementTree as ET

                  report = Path("kit-selenium/target/surefire-reports/TEST-io.allurx.kit.selenium.test.ChromeStartupTest.xml")
                  suite = ET.parse(report).getroot()
                  expected = {"tests": "1", "failures": "0", "errors": "0", "skipped": "0"}
                  actual = {name: suite.get(name) for name in expected}
                  if actual != expected:
                      raise SystemExit(f"Real Chrome verification did not pass without skips: {actual}")
                  print("Real Chrome startup and interaction passed: 1 test, 0 skipped.")
                  PY
            - name: Preserve Selenium reports
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: selenium-reports-${{ github.run_id }}-${{ github.run_attempt }}
                  path: kit-selenium/target/surefire-reports/**
                  if-no-files-found: ignore
                  retention-days: 14
